name: Public source evidence checks
on:
  push:
    paths:
      - 'src/check_sources.py'
      - '.github/workflows/source-checks.yml'
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-source-evidence
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Tests before evidence collection
        run: python3 -m unittest discover -s src -p 'test_*.py'
      - name: Retrieve public sources without authorizing trading
        run: python3 src/check_sources.py
