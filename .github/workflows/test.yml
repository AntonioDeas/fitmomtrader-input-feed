name: Admission tests only
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Offline synthetic fault tests
        run: python3 -m unittest discover -s src -p 'test_*.py'
